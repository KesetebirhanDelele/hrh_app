[project]
name = "hrh_app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "jsonschema>=4.22.0",
  "referencing>=0.30.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.2",
  "python-docx>=1.1.2",
  "pdfplumber>=0.10.0",
  "numpy>=1.24.0"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
